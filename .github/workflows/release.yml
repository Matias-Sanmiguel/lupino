name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v0.1.0
        required: true
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: macos-15
            platform: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            platform: macos-intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo test --workspace --locked
      - run: node scripts/prepare-runtime.mjs
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}
        env:
          NO_STRIP: true
      - run: node scripts/collect-release.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Lupino-${{ matrix.platform }}
          path: release-assets/*
      - name: Publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
